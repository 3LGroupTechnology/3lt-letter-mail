<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save payment method — 3L-Group Technology</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:20px;
background:#f6f7f9;color:#1a1a1a}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;
padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;
border-radius:8px;font-size:15px;box-sizing:border-box}
button{background:#16a34a;color:#fff;border:none;border-radius:12px;
padding:14px;width:100%;font-size:16px;font-weight:700;cursor:pointer;
margin-top:12px}
#msg{margin-top:12px;font-size:14px}
</style></head><body><div class="card">
<h2>Save a payment method</h2>
<p style="color:#666;font-size:14px">Card, Apple&nbsp;Pay, or Google&nbsp;Pay.
Saved once — future sends are charged automatically, one tap, no checkout.</p>
<input id="keyid" placeholder="API key id (numeric)">
<input id="admintoken" type="password" placeholder="Admin token">
<button id="start">Continue</button>
<div id="pay"></div>
<div id="msg"></div>
</div>
<script src="https://js.stripe.com/v3/"></script>
<script>
const msg = t => document.getElementById('msg').textContent = t;
document.getElementById('start').onclick = async () => {
  const keyId = document.getElementById('keyid').value.trim();
  const admin = document.getElementById('admintoken').value.trim();
  if (!keyId || !admin) { msg('Enter the key id and admin token.'); return; }
  msg('Loading…');
  const cfg = await (await fetch('/v1/billing/config')).json();
  if (!cfg.publishable_key) { msg('Stripe publishable key is not configured.'); return; }
  const si = await fetch(`/v1/admin/keys/${keyId}/setup-intent`, {
    method: 'POST', headers: {'X-Admin-Token': admin}});
  if (!si.ok) { msg('Setup failed: ' + await si.text()); return; }
  const {client_secret} = await si.json();
  const stripe = Stripe(cfg.publishable_key);
  const elements = stripe.elements({clientSecret: client_secret});
  const paymentElement = elements.create('payment');
  paymentElement.mount('#pay');
  const btn = document.createElement('button');
  btn.textContent = 'Save payment method';
  btn.onclick = async () => {
    msg('Saving…');
    const {error} = await stripe.confirmSetup({
      elements, confirmParams: {return_url: location.href}, redirect: 'if_required'});
    msg(error ? 'Error: ' + error.message
              : 'Saved ✓ — this key can now be charged automatically.');
  };
  document.getElementById('pay').appendChild(btn);
  document.getElementById('start').style.display = 'none';
  msg('');
};
</script></body></html>
